server:
  port: 8088
  servlet:
    context-path: /message-board

spring:
  application:
    name: message-board
  datasource:
    # 留言板系统数据库
    url: jdbc:mysql://localhost:3306/message_board?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowMultiQueries=true&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# 文件上传配置
file:
  upload:
    # 附件上传目录（绝对路径或相对路径）
    path: D:/uploads
    # 单个文件最大大小
    max-size: 10MB
    # 允许的文件类型
    allow-types: jpg,jpeg,png,gif,bmp,pdf,doc,docx,xls,xlsx,ppt,pptx,txt,zip,rar

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: status
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志配置
logging:
  level:
    com.messageboard: info
    org.springframework: warn
  file:
    # 日志文件路径（可修改）
    path: D:/opt/logs
    # 日志文件名
    name: ${logging.file.path}/message-board.log
  pattern:
    # 控制台日志格式
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    # 文件日志格式
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      # 单个日志文件最大大小
      max-file-size: 10MB
      # 保留的日志文件天数
      max-history: 30
      # 所有日志文件总大小上限
      total-size-cap: 500MB
