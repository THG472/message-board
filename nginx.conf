# Nginx 配置示例
# 将本文件内容添加到 nginx.conf 的 server 块中

server {
    listen       80;
    server_name  your-domain.com;  # 修改为你的域名或IP

    # 前端静态文件（message 目录）
    location /message {
        alias   /path/to/message;  # 修改为前端打包文件的实际路径
        index   index.html;
        try_files $uri $uri/ /message/index.html;
    }

    # 后端 API 代理到 SpringBoot（Tomcat）
    location /message-board/ {
        proxy_pass http://127.0.0.1:8080/message-board/;  # 修改为后端实际地址和端口
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
